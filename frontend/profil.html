<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profil · Yemekhane</title>
  <link rel="stylesheet" href="/css/temel.css">
  <link rel="stylesheet" href="/css/uygulama.css">
</head>
<body>
  <main class="kapsayici">
    <h1>Profil</h1>
    <p id="bildirim" hidden></p>

    <div class="iki-sutun">
      <section class="kart">
        <h2>Bilgilerim</h2>
        <dl id="bilgiler" class="bilgiler"></dl>
      </section>

      <section class="kart">
        <h2>Alerjenlerim</h2>
        <p class="soluk">Seçtiğiniz alerjenleri içeren yemekler menüde uyarıyla gösterilir.</p>
        <form id="alerjen-formu">
          <div id="alerjenler" class="secim-izgara"></div>
          <button type="submit" class="dugme">Kaydet</button>
        </form>
      </section>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/ortak.js"></script>
  <script src="/js/profil.js"></script>
</body>
</html>
